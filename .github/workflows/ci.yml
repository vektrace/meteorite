name: Rust Checks

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Prexec (Environment Setup)
        run: |
            # dioxus deps
            sudo apt-get update
            sudo apt-get install -y \
              pkg-config \
              libglib2.0-dev \
              libgtk-3-dev \
              libjavascriptcoregtk-4.1-dev \
              libsoup-3.0-dev \
              libwebkit2gtk-4.1-dev \
              libxdo-dev

      - name: Formatting Check
        run: cargo fmt --all --check

      - name: Clippy Check
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

      - name: Run Tests
        run: cargo test --all-features --workspace

  macos:
    name: Checks (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check
        run: cargo check --all-features --workspace

  windows:
    name: Checks (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Prexec (Environment Setup)
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl" | tee -a "$GITHUB_ENV"

      - name: Check
        run: cargo check --all-features --workspace

  android:
    name: Checks (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Android SDK & NDK
        uses: amyu/setup-android@09345fc2cbed5b3a92beea84d843a22eac6cc841
        with:
          ndk-version: "25.2.9519653"

      - name: Add NDK to PATH
        run: |
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check
        run: cargo check --all-features --workspace --target aarch64-linux-android

  ios:
    name: Checks (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check
        run: cargo check --all-features --workspace --target aarch64-apple-ios
